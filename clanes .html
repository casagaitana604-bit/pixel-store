<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salón de la Sangre - Ranking de Clanes</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #dcdcdc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ff3333;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #ff000080;
        }
        .ranking-container {
            max-width: 900px;
            margin: 30px auto;
            background: #151515;
            border: 1px solid #330000;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.15);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background-color: #500000;
            color: #fff;
            padding: 15px;
            font-size: 1.1em;
            text-transform: uppercase;
        }
        td {
            padding: 15px;
            border-bottom: 1px solid #2a2a2a;
        }
        tr:hover {
            background-color: #220000;
            transition: 0.3s;
        }
        .top-1 {
            color: #ffcc00;
            font-weight: bold;
            font-size: 1.2em;
        }
        .top-2 { color: #c0c0c0; font-weight: bold; }
        .top-3 { color: #cd7f32; font-weight: bold; }
        .loading {
            padding: 30px;
            color: #ff3333;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>🦇 Salón de la Sangre 🦇</h1>
    <p>Ranking Oficial de Clanes Vampiros de Pixel Store</p>

    <div class="ranking-container">
        <table>
            <thead>
                <tr>
                    <th># Rango</th>
                    <th>Nombre de la Casa</th>
                    <th>Líder Fundador</th>
                    <th>Nivel</th>
                    <th>XP Acumulada</th>
                    <th>Guerreros</th>
                </tr>
            </thead>
            <tbody id="tabla-clanes">
                <tr><td colspan="6" class="loading">Consultando archivos antiguos (Cargando datos)...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // PON AQUÍ TU URL DE GOOGLE APPS SCRIPT
        const API_URL = "AQUI_TU_URL_DE_GOOGLE_SCRIPT";

        async function cargarRanking() {
            try {
                const respuesta = await fetch(API_URL);
                const datos = await respuesta.json();
                
                const tabla = document.getElementById("tabla-clanes");
                tabla.innerHTML = ""; // Limpiamos el mensaje de carga

                if (!datos.clanes || datos.clanes.length === 0) {
                    tabla.innerHTML = "<tr><td colspan='6'>Aún no hay clanes registrados en el mundo.</td></tr>";
                    return;
                }

                // Generar las filas de la tabla
                datos.clanes.forEach((clan, index) => {
                    let posicion = index + 1;
                    let clasePosicion = "";
                    
                    if (posicion === 1) clasePosicion = "top-1";
                    else if (posicion === 2) clasePosicion = "top-2";
                    else if (posicion === 3) clasePosicion = "top-3";

                    let fila = `
                        <tr>
                            <td class="${clasePosicion}">#${posicion}</td>
                            <td style="font-weight: bold; color: #fff;">${clan.nombre}</td>
                            <td>${clan.lider}</td>
                            <td><span style="color: #ff3333; font-weight: bold;">Nvl ${clan.nivel}</span></td>
                            <td>${clan.xp.toLocaleString()} / 50.000</td>
                            <td>${clan.total_miembros} / 25</td>
                        </tr>
                    `;
                    tabla.innerHTML += fila;
                });
            } catch (error) {
                console.error("Error cargando los clanes:", error);
                document.getElementById("tabla-clanes").innerHTML = "<tr><td colspan='6' style='color:red;'>Error de conexión con los ancestros.</td></tr>";
            }
        }

        // Ejecutar al abrir la página
        cargarRanking();
        
        // Refrescar automáticamente cada 60 segundos
        setInterval(cargarRanking, 60000); 
    </script>

</body>
</html>
