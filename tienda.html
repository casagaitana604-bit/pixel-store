<!DOCTYPE html>
<html lang="es">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PRDENRQW1P"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-PRDENRQW1P');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK REALMS - Mercado Real &amp; Reliquias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #c9a252;
            --gold-bright: #f0cf7b;
            --crimson: #8f1622;
            --crimson-bright: #c92a3a;
            --stone-dark: #0e0c0b;
            --stone-card: rgba(20, 17, 15, 0.94);
            --border-iron: #3a3129;
            --parchment: #e6dcc8;
            --muted: #9e917d;
        }
        
        * { box-sizing: border-box; }

        body { 
            font-family: 'Lora', Georgia, serif; 
            background-image: 
                radial-gradient(circle at top, rgba(38, 16, 12, 0.76), rgba(8, 7, 6, 0.96)),
                url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--parchment); 
            margin: 0; 
        }

        h1, h2, h3, .nav-logo, .nav-links a, .lang-btn, .filter-btn, .btn-buy, .item-category, .item-name {
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
        }

        /* NAVEGACIÓN */
        .main-nav { 
            background: rgba(12, 10, 9, 0.96); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 16px 50px; 
            border-bottom: 2px solid var(--gold); 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.85);
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }
        .nav-logo { color: var(--parchment); font-weight: 900; font-size: 1.45rem; letter-spacing: 3px; }
        .nav-logo span { color: var(--gold); }
        .nav-links { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
        .nav-links a { 
            color: var(--muted); 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 0.88rem; 
            letter-spacing: 1.5px;
            transition: 0.25s; 
        }
        .nav-links a:hover { color: var(--gold-bright); }
        .nav-active { 
            color: var(--gold-bright) !important; 
            border-bottom: 2px solid var(--gold); 
            padding-bottom: 5px; 
        }

        /* SELECTOR DE IDIOMA POR PÁGINA */
        .lang-switcher {
            display: inline-flex;
            align-items: center;
            background: #14100d;
            border: 1px solid var(--gold);
            border-radius: 2px;
            overflow: hidden;
            margin-left: 8px;
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            padding: 6px 10px;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
        }
        .lang-btn:hover { color: var(--parchment); background: rgba(201, 162, 82, 0.15); }
        .lang-btn.active {
            background: var(--gold);
            color: #120d08;
        }

        /* CABECERA HERO */
        .hero-header {
            text-align: center;
            padding: 60px 20px 30px 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.88), transparent);
            border-bottom: 1px solid rgba(201, 162, 82, 0.15);
        }
        .main-title {
            font-size: 4rem;
            font-weight: 900;
            margin: 0;
            color: var(--gold-bright);
            letter-spacing: 4px;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95), 0 0 35px rgba(143, 22, 34, 0.65);
            line-height: 1.1;
        }
        .subtitle-bar {
            display: inline-block;
            margin-top: 16px;
            padding: 7px 32px;
            background: rgba(24, 19, 16, 0.92);
            border-top: 1px solid var(--gold);
            border-bottom: 1px solid var(--gold);
            color: var(--parchment);
            font-family: 'Cinzel', serif;
            font-weight: 700;
            letter-spacing: 4px;
            font-size: 0.9rem;
        }

        .container { max-width: 1400px; margin: 30px auto 80px auto; padding: 0 25px; }
        
        .section-title {
            color: var(--gold-bright);
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
            margin-bottom: 25px;
            letter-spacing: 2.5px;
            font-size: 1.35rem;
        }

        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 50px;
        }

        /* TARJETA MEDIEVAL DE ARTÍCULO */
        .store-card {
            background: var(--stone-card);
            border: 1px solid var(--border-iron);
            border-radius: 3px;
            padding: 22px 20px;
            text-align: center;
            transition: 0.25s;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.85), 0 6px 18px rgba(0,0,0,0.75);
        }
        .store-card:hover {
            border-color: var(--gold);
            transform: translateY(-4px);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.85), 0 10px 25px rgba(201, 162, 82, 0.2);
        }

        .store-img {
            width: 100%;
            height: 165px;
            object-fit: cover;
            border-radius: 2px;
            border: 1px solid var(--border-iron);
            margin-bottom: 14px;
            background: #090807;
        }

        .item-category {
            font-size: 0.72rem;
            color: var(--gold);
            letter-spacing: 2px;
            font-weight: 700;
            display: block;
            margin-bottom: 8px;
        }

        .item-name {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 8px 0;
            color: var(--parchment);
            letter-spacing: 1px;
        }

        .seller-tag {
            font-size: 0.84rem;
            color: var(--muted);
            margin-bottom: 6px;
            font-style: italic;
        }

        .item-price {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: var(--gold-bright);
            font-weight: 900;
            margin: 14px 0;
            letter-spacing: 1.5px;
        }

        .btn-buy {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(180deg, #4a0e14 0%, #240508 100%);
            border: 1px solid var(--gold);
            color: var(--gold-bright);
            font-weight: 700;
            font-size: 0.82rem;
            letter-spacing: 2px;
            text-decoration: none;
            border-radius: 2px;
            transition: 0.25s;
            cursor: pointer;
        }
        .btn-buy:hover {
            background: linear-gradient(180deg, #6e141d 0%, #36070c 100%);
            color: #fff;
            border-color: var(--gold-bright);
        }

        /* FILTROS DEL MERCADO */
        .filter-container {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: rgba(18, 15, 13, 0.95);
            border: 1px solid var(--border-iron);
            color: var(--muted);
            padding: 10px 18px;
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 1.5px;
            cursor: pointer;
            border-radius: 2px;
            transition: 0.2s;
        }
        .filter-btn:hover {
            border-color: var(--gold);
            color: var(--parchment);
        }
        .filter-btn.active {
            border-color: var(--gold);
            background: var(--gold);
            color: #120d08;
        }

        .market-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            padding: 40px;
            background: var(--stone-card);
            border: 1px solid var(--border-iron);
            font-family: 'Cinzel', serif;
            letter-spacing: 1.5px;
        }

        @media (max-width: 850px) {
            .main-title { font-size: 2.5rem; }
            .main-nav { padding: 14px 20px; flex-direction: column; gap: 10px; }
            .nav-links { justify-content: center; gap: 14px; }
        }
    </style>
</head>
<body>

<nav class="main-nav">
    <div class="nav-logo">DARK REALMS <span>SURVIVAL</span></div>
    <div class="nav-links">
        <a href="index.html" data-i18n="nav_reino">REINO</a>
        <a href="clanes.html" data-i18n="nav_clanes">CLANES &amp; RAZAS</a>
        <a href="tienda.html" class="nav-active" data-i18n="nav_mercado">MERCADO</a>
        <a href="info.html" data-i18n="nav_codice">CÓDICE</a>
        <div class="lang-switcher" title="Idioma / Language">
            <button id="lang-es" class="lang-btn active" onclick="setLanguage('es')">ES</button>
            <button id="lang-en" class="lang-btn" onclick="setLanguage('en')">EN</button>
            <button id="lang-pt" class="lang-btn" onclick="setLanguage('pt')">PT</button>
        </div>
    </div>
</nav>

<header class="hero-header">
    <h1 class="main-title" data-i18n="hero_title">MERCADO REAL &amp; RELIQUIAS</h1>
    <div class="subtitle-bar" data-i18n="hero_subtitle">SUMINISTROS DE LA CORONA Y CONSIGNACIÓN DE GUERREROS</div>
</header>

<div class="container">
    
    <!-- SECCIÓN 1: TIENDA OFICIAL DE LA CORONA -->
    <h2 class="section-title" data-i18n="sec_official">👑 CÁMARA REAL DE SUMINISTROS (OFICIAL)</h2>
    <div id="official-store-grid" class="store-grid"></div>

    <!-- SECCIÓN 2: MERCADO GLOBAL DE JUGADORES -->
    <h2 class="section-title" style="margin-top: 50px;" data-i18n="sec_market">⚖️ BAZAR DE MERCADERES Y GUERREROS</h2>
    
    <div class="filter-container">
        <button id="btn-filter-TODOS" class="filter-btn active" onclick="filterMarket('TODOS')" data-i18n="flt_all">🏰 TODOS</button>
        <button id="btn-filter-RECURSO" class="filter-btn" onclick="filterMarket('RECURSO')" data-i18n="flt_res">⛏️ RECURSOS</button>
        <button id="btn-filter-PECES" class="filter-btn" onclick="filterMarket('PECES')" data-i18n="flt_fish">🐟 PECES</button>
        <button id="btn-filter-ARMAS" class="filter-btn" onclick="filterMarket('ARMAS')" data-i18n="flt_weapons">⚔️ ARMAS</button>
        <button id="btn-filter-ROPA" class="filter-btn" onclick="filterMarket('ROPA')" data-i18n="flt_armor">🛡️ ARMADURA</button>
    </div>

    <div id="market-store-grid" class="store-grid">
        <div class="market-msg" data-i18n="msg_loading">CONSULTANDO LOS LIBROS DEL BAZAR...</div>
    </div>

</div>

<script>
    // ===========================================================================
    // 🛠️ ARTÍCULOS OFICIALES (Con soporte multi-idioma ES / EN / PT)
    // ===========================================================================
    const ARTICULOS_OFICIALES = [
        {
            nombre: {
                es: "Poción de Supervivencia (x10)",
                en: "Survival Potion Pack (x10)",
                pt: "Poção de Sobrevivência (x10)"
            },
            categoria: {
                es: "ALQUIMIA & BREBAJES",
                en: "ALCHEMY & BREWS",
                pt: "ALQUIMIA & POÇÕES"
            },
            precio: "5 L$",
            imagen: "https://static.vecteezy.com/system/resources/previews/039/657/374/non_2x/ai-generated-us-soldier-with-rifle-free-png.png",
            slurl: "http://maps.secondlife.com/secondlife/Peaches/138/183/2920"
        }
    ];

    const API_MERCADO = "https://script.google.com/macros/s/AKfycbyB3-mK8AKmr7LrjGH45Oc0fxMOOaQS-IN1oJOJ_VmzaG_q2AsTOH0G4lx5knYpuw-z/exec";
    let mercadoCache = [];
    let filtroActual = "TODOS";
    let currentLang = localStorage.getItem("darkrealms_lang") || "es";

    // ===========================================================================
    // 🌐 DICCIONARIO DE TRADUCCIÓN DE ESTA PÁGINA (ES / EN / PT)
    // ===========================================================================
    const I18N = {
        es: {
            nav_reino: "REINO",
            nav_clanes: "CLANES & RAZAS",
            nav_mercado: "MERCADO",
            nav_codice: "CÓDICE",
            hero_title: "MERCADO REAL & RELIQUIAS",
            hero_subtitle: "SUMINISTROS DE LA CORONA Y CONSIGNACIÓN DE GUERREROS",
            sec_official: "👑 CÁMARA REAL DE SUMINISTROS (OFICIAL)",
            sec_market: "⚖️ BAZAR DE MERCADERES Y GUERREROS",
            flt_all: "🏰 TODOS",
            flt_res: "⛏️ RECURSOS",
            flt_fish: "🐟 PECES",
            flt_weapons: "⚔️ ARMAS",
            flt_armor: "🛡️ ARMADURA",
            msg_loading: "CONSULTANDO LOS LIBROS DEL BAZAR...",
            msg_error: "ERROR AL CONECTAR CON LOS ARCHIVOS DEL BAZAR",
            msg_empty: "NO HAY RELIQUIAS NI SUMINISTROS EN ESTA CATEGORÍA",
            btn_buy_official: "⚔️ ADQUIRIR EN EL REINO",
            btn_buy_kiosk: "🏛️ COMPRAR EN EL PUESTO",
            consigned_tag: "CONSIGNACIÓN",
            seller_label: "Mercader",
            default_seller: "Guerrero del Reino"
        },
        en: {
            nav_reino: "REALM",
            nav_clanes: "CLANS & RACES",
            nav_mercado: "MARKET",
            nav_codice: "CODEX",
            hero_title: "ROYAL MARKET & RELICS",
            hero_subtitle: "CROWN SUPPLIES & WARRIOR CONSIGNMENT",
            sec_official: "👑 ROYAL SUPPLY VAULT (OFFICIAL)",
            sec_market: "⚖️ MERCHANTS & WARRIORS BAZAAR",
            flt_all: "🏰 ALL",
            flt_res: "⛏️ RESOURCES",
            flt_fish: "🐟 FISH",
            flt_weapons: "⚔️ WEAPONS",
            flt_armor: "🛡️ ARMOR",
            msg_loading: "CONSULTING THE BAZAAR LEDGERS...",
            msg_error: "ERROR CONNECTING TO THE BAZAAR ARCHIVES",
            msg_empty: "NO RELICS OR SUPPLIES AVAILABLE IN THIS CATEGORY",
            btn_buy_official: "⚔️ ACQUIRE IN REALM",
            btn_buy_kiosk: "🏛️ BUY AT TRADING POST",
            consigned_tag: "CONSIGNED",
            seller_label: "Merchant",
            default_seller: "Realm Warrior"
        },
        pt: {
            nav_reino: "REINO",
            nav_clanes: "CLÃS & RAÇAS",
            nav_mercado: "MERCADO",
            nav_codice: "CÓDICE",
            hero_title: "MERCADO REAL & RELÍQUIAS",
            hero_subtitle: "SUPRIMENTOS DA COROA E CONSIGNAÇÃO DE GUERREIROS",
            sec_official: "👑 CÂMARA REAL DE SUPRIMENTOS (OFICIAL)",
            sec_market: "⚖️ BAZAR DE MERCADORES E GUERREIROS",
            flt_all: "🏰 TODOS",
            flt_res: "⛏️ RECURSOS",
            flt_fish: "🐟 PEIXES",
            flt_weapons: "⚔️ ARMAS",
            flt_armor: "🛡️ ARMADURA",
            msg_loading: "CONSULTANDO OS LIVROS DO BAZAR...",
            msg_error: "ERRO AO CONECTAR COM OS ARQUIVOS DO BAZAR",
            msg_empty: "NENHUMA RELÍQUIA OU SUPRIMENTO NESTA CATEGORIA",
            btn_buy_official: "⚔️ ADQUIRIR NO REINO",
            btn_buy_kiosk: "🏛️ COMPRAR NO POSTO",
            consigned_tag: "CONSIGNADO",
            seller_label: "Mercador",
            default_seller: "Guerreiro do Reino"
        }
    };

    function t(key) {
        return (I18N[currentLang] && I18N[currentLang][key]) || I18N.es[key] || key;
    }

    function setLanguage(lang) {
        if (!I18N[lang]) return;
        currentLang = lang;
        localStorage.setItem("darkrealms_lang", lang);
        document.documentElement.lang = lang;

        ["es", "en", "pt"].forEach(l => {
            const btn = document.getElementById(`lang-${l}`);
            if (btn) btn.classList.toggle("active", l === lang);
        });

        document.querySelectorAll("[data-i18n]").forEach(el => {
            const key = el.getAttribute("data-i18n");
            el.innerHTML = t(key);
        });

        renderTiendaOficial();
        renderMercado(mercadoCache);
    }

    function renderTiendaOficial() {
        const grid = document.getElementById('official-store-grid');
        grid.innerHTML = '';
        
        ARTICULOS_OFICIALES.forEach(item => {
            const nom = (typeof item.nombre === "object") ? (item.nombre[currentLang] || item.nombre.es) : item.nombre;
            const cat = (typeof item.categoria === "object") ? (item.categoria[currentLang] || item.categoria.es) : item.categoria;

            grid.innerHTML += `
                <div class="store-card">
                    <span class="item-category">⚜️ ${cat}</span>
                    <img src="${item.imagen}" class="store-img" alt="${nom}">
                    <div class="item-name">${nom}</div>
                    <div class="item-price">${item.precio}</div>
                    <a href="${item.slurl}" target="_blank" class="btn-buy">${t("btn_buy_official")}</a>
                </div>
            `;
        });
    }

    async function cargarMercadoGlobal() {
        try {
            const res = await fetch(API_MERCADO);
            const data = await res.json();
            mercadoCache = Array.isArray(data) ? data : (data.items || []);
            renderMercado(mercadoCache);
        } catch (e) {
            document.getElementById('market-store-grid').innerHTML = `<div class="market-msg" style="color: #e57373;">${t("msg_error")}</div>`;
        }
    }

    function renderMercado(items) {
        const grid = document.getElementById('market-store-grid');
        grid.innerHTML = '';

        let filtrados = items;
        if (filtroActual !== 'TODOS') {
            filtrados = items.filter(i => String(i.tipo || "").toUpperCase() === filtroActual);
        }

        if (filtrados.length === 0) {
            grid.innerHTML = `<div class="market-msg">${t("msg_empty")}</div>`;
            return;
        }

        filtrados.forEach(item => {
            let imgDefault = "https://img.freepik.com/premium-vector/soldier-uniform-cartoon-character-vector_614983-3103.jpg?w=2000";
            if (item.tipo === "RECURSO") imgDefault = "https://img.freepik.com/fotos-premium/alegre-aventura-camuflaje-alegre-animado-joven-soldado-equipo-militar_337384-58330.jpg";
            if (item.tipo === "PECES") imgDefault = "https://www.gifss.com/profesiones/soldados/soldado-02.gif";

            grid.innerHTML += `
                <div class="store-card">
                    <span class="item-category">📜 ${t("consigned_tag")} [${item.tipo}]</span>
                    <img src="${item.imagen || imgDefault}" class="store-img" alt="${item.nombre}">
                    <div class="item-name">${item.nombre}</div>
                    <div class="seller-tag">${t("seller_label")}: ${item.vendedor_nombre || t("default_seller")}</div>
                    <div class="item-price">${item.precio} L$</div>
                    <a href="http://maps.secondlife.com/secondlife/Peaches/138/183/2920" target="_blank" class="btn-buy">${t("btn_buy_kiosk")}</a>
                </div>
            `;
        });
    }

    function filterMarket(tipo) {
        filtroActual = tipo;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        const activeBtn = document.getElementById(`btn-filter-${tipo}`);
        if (activeBtn) activeBtn.classList.add('active');
        renderMercado(mercadoCache);
    }

    // Inicializar con el idioma seleccionado
    setLanguage(currentLang);
    cargarMercadoGlobal();
    setInterval(cargarMercadoGlobal, 30000);
</script>

</body>
</html>
